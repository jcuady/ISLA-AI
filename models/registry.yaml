## Fetch

```powershell
# Everything, ordered by demo criticality
.venv\Scripts\python.exe models\download_models.py

# Skip the optional NER stage when time or bandwidth is short
.venv\Scripts\python.exe models\download_models.py --skip-optional

# One asset
.venv\Scripts\python.exe models\download_models.py --only multilingual-e5-small-int8
```

The downloader uses **ranged parallel connections**. The single-stream HF transfer on this network
stalled at ~8 KB/s; parallel ranges sustained ~0.3 MB/s. Each asset is written to a sparse file,
assembled from blocks, and verified by SHA-256.

> **Known: the huggingface.co single-stream path can stall.** If a download appears frozen, check the
> `.part` file size before restarting — the ranged fetcher preallocates the full length, so file size
> alone does not indicate progress. The progress log line does.

---

## Integrity

`download_models.py` computes and prints a SHA-256 per asset on completion. Record expected digests in
your own deployment manifest and **verify at load**, not only at download — a weight file can be
replaced after the initial fetch.

```powershell
Get-FileHash models\weights\qwen2.5-3b-instruct-q4_k_m\qwen2.5-3b-instruct-q4_k_m.gguf -Algorithm SHA256
```

