## Optional tiers

| Tier | Hardware | Model | Size |
|---|---|---|---|
| T1 — Branch box | Intel N100/N305, 16 GB, no GPU | `bartowski/Phi-3.5-mini-instruct-GGUF` Q4_K_M | 2.4 GB |
| T2 — Standard laptop | 32 GB, RTX 4060 8 GB | `Qwen/Qwen2.5-7B-Instruct-GGUF` Q4_K_M | 4.7 GB |
| T3 — Analyst WS | 64–128 GB, RTX 4090 | `Qwen/Qwen2.5-14B-Instruct-GGUF` Q4_K_M | 9 GB |

Fetch any of these by editing the `ASSETS` list in `models/download_models.py`, or by passing the GGUF
path directly to `llama-server`.

