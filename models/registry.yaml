# Model registry

Pinned model weights for KALIX. **No weights are committed to this repository.**
`models/download_models.py` fetches these files and records their SHA-256.

All licences are commercial-use compatible. See [`docs/LICENSING.md`](../docs/LICENSING.md).

---

## Runtime models

| Key | Repo | File | Size | Licence | Role | Critical |
|---|---|---|---|---|---|---|
| `multilingual-e5-small-int8` | `intfloat/multilingual-e5-small` | `onnx/model_qint8_avx512_vnni.onnx` | 113 MB | MIT | Embeddings (retrieval) | ✅ |
| `qwen2.5-3b-instruct-q4_k_m` | `Qwen/Qwen2.5-3B-Instruct-GGUF` | `qwen2.5-3b-instruct-q4_k_m.gguf` | 2.0 GB | Apache-2.0 | Generation (optional) | ✅ |
| `gliner-multi-v2.1` | `urchade/gliner_multi-v2.1` | `model.safetensors` | 1.1 GB | Apache-2.0 | Contextual NER (optional) | — |

### Why e5-small rather than bge-m3

The blueprint specified `bge-m3` (568 M params, ~2.3 GB) with no int8 ONNX export. The development
machine had ~1 GB of free RAM, which cannot host it alongside the LLM. `multilingual-e5-small` int8 is
**113 MB** and is genuinely cross-lingual — which is the actual requirement, because queries arrive in
Taglish while the corpus is English. Twenty times lighter, same job.

### Why Qwen2.5-3B rather than 7B

No NVIDIA GPU. A 7B Q4_K_M on CPU with ~1 GB free RAM risks slow answers or OOM during a live
demonstration. 3B keeps latency comfortable and frees RAM for GLiNER and the embedding model running
simultaneously. The 7B and 14B tiers are documented for T2/T3 hardware.

