## llama.cpp

Binary distribution is **not** vendored. Fetched from `ggml-org/llama.cpp`, tag pinned to **`b11515`**.

> Do **not** use the `latest` release tag — it resolves to a nightly stub with no Windows binaries
> attached. `b11515` carries the Vulkan and CPU builds.

```
models/llamacpp/vulkan/llama-server.exe
models/llamacpp/vulkan/llama-b11515-bin-win-vulkan-x64.zip
```

Licence: MIT. The Zen4 CPU backend (`ggml-cpu-zen4.dll`) is present and is the natural path on an
AMD Ryzen host.