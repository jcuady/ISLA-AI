name: verify

# Isla AI claims are reproducible claims. This workflow regenerates the published
# scoreboard on every push so a reviewer never has to take the README on trust.
#
# Four independent jobs, each proving a different claim:
#   1. pii-guard      - zero third-party dependencies at all
#   2. tests + eval   - no model weights, no GPU, BM25 fallback only
#   3. web build      - the UI type-checks, passes its behaviour suite, compiles
#   4. live QA        - a running server survives hostile input, and every demo
#                       use case still returns the answer the demo claims

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pii-guard:
    name: PII guard (standard library only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install step on purpose. services/pii/engine.py and recognizers.py
      # import only the standard library, so this job fails the moment someone
      # introduces a hidden ML dependency into the Egress Guard hot path.
      - name: Regenerate the PII scoreboard with zero dependencies
        run: python eval/run_eval.py --pii-only

      - name: Show the scoreboard
        run: cat eval/RESULTS_PII.md

      - uses: actions/upload-artifact@v4
        with:
          name: eval-pii-no-dependencies
          path: eval/RESULTS_PII.md

  tests-and-eval:
    name: Tests and RAG eval (no model weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the verification dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-verify.txt

      - name: Unit tests
        run: python -m pytest tests/ -q

      # --sparse-only skips the dense embedding leg and writes to a separate file
      # so it can never overwrite the headline RESULTS.md. Passing here proves the
      # copilot still cites correctly on a machine with no model weights at all.
      - name: RAG eval without dense retrieval
        run: python eval/run_eval.py --sparse-only

      # Every published gate must hold, in this configuration and in the full-hybrid one.
      # No metric is exempted: a regression in any direction fails the build, whether it
      # improves or degrades. Source attribution used to sit exactly on its 80% target
      # and is now 100% after the front-line guide was added; how it moved is documented
      # in docs/DISCLOSURES.md section 7.
      - name: Fail if any published gate regressed
        run: |
          if grep '| MISS |' eval/RESULTS_SPARSE_ONLY.md; then
            echo "::error::a published gate regressed"
            exit 1
          fi
          echo "All published gates hold with no model weights installed."

      - uses: actions/upload-artifact@v4
        with:
          name: eval-sparse-only
          path: eval/RESULTS_SPARSE_ONLY.md

  live-qa:
    name: Live QA (hostile input + demo use cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the verification dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-verify.txt

      # The two scripts below need the app running, so this job starts it. They
      # cover what the unit tests structurally cannot: that a live server answers
      # a hostile payload without a 500 or a stack trace, and that every beat in
      # docs/DEMO_SCRIPT.md still returns the result the demo claims.
      - name: Start the server
        run: |
          python -m uvicorn services.core.app:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8765/api/health > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become healthy"; exit 1

      # Fails the build on any 500, any leaked traceback, any unknown path that
      # answers 200, or any missing security header.
      - name: Adversarial probe of every endpoint
        run: python scripts/qa_probe.py

      # Fails the build if any demo beat stops returning its answer.
      - name: Walk every documented use case
        run: python scripts/use_case_walk.py

  web-build:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Type errors and behaviour tests both fail the build. The UI suite is
      # the only place the four-channel status rule is enforced, so it is a
      # correctness gate rather than a nice-to-have.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # The landing page permits its inline reveal script only by SHA-256 hash,
      # in two places that must agree (the page meta and the server header). If
      # the script changes without both being updated, the page silently loses
      # every section below the fold.
      - name: Assert the CSP inline-script hash is current
        run: node verify-ui.mjs --csp-only

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7