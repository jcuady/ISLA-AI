<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/isla-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Isla AI — In-Situ Local AI Privacy Compliance Copilot</title>
    <meta
      name="description"
      content="Isla AI runs Philippine data-privacy compliance inference on the machine the data already lives on. No customer data ever leaves it."
    />
    <meta name="theme-color" content="#010f14" />
    <!--
      Self-hosted variable fonts, preloaded so the first paint is already in the
      brand face. `default-src 'none'` forbids a font CDN by design: the whole
      product claim is that nothing is fetched externally, and its own typeface
      has to obey that too. See branding/brand.md.
    -->
    <link
      rel="preload"
      href="/fonts/outfit.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
